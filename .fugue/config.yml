version: 1

protocol:
  version: 1

repository:
  default_branch: main
  agents_file: AGENTS.md

control_plane:
  paths:
    - "AGENTS.md"
    - ".fugue/**"
    - ".github/workflows/**"
    - ".github/ISSUE_TEMPLATE/**"
    - ".github/pull_request_template.md"

validation:
  install:
    - npm ci
  checks:
    - npm run check
    - npm test
    - npm run build
  required_ci:
    - test
  required_ci_workflow: ".github/workflows/ci.yml"
  control_paths:
    - "package.json"
    - "package-lock.json"
    - "tsconfig.json"
    - "scripts/**"
    - "src/core/validation.ts"
    - "src/core/ci.ts"
    - "src/core/integration.ts"
    - "src/core/integration-plan.ts"
    - "src/commands/integration-runtime.ts"

reviews:
  code:
    required: always

  security:
    required: conditional
    paths:
      - ".github/workflows/**"
      - ".fugue/**"
      - "package.json"
      - "package-lock.json"
      - "src/core/github.ts"
      - "src/core/integration.ts"
      - "src/core/integration-plan.ts"
      - "src/core/integration-status.ts"
      - "src/core/reconcile.ts"
      - "src/core/submissions.ts"
      - "src/core/ownership.ts"
      - "src/core/reviews.ts"
      - "src/core/review-activity.ts"
      - "src/core/workflow.ts"
      - "src/core/evaluation.ts"
      - "src/core/gates.ts"
      - "src/core/state.ts"
      - "src/core/state-comment.ts"
      - "src/core/provenance.ts"
      - "src/core/ci.ts"
      - "src/core/config.ts"
      - "src/core/attestations.ts"
      - "src/core/qa.ts"
      - "src/core/metadata.ts"
      - "src/core/pr-metadata.ts"
      - "src/core/hash.ts"
      - "src/core/glob.ts"
      - "src/core/worker.ts"
      - "src/core/dependencies.ts"
      - "src/core/policy.ts"
      - "src/core/protocol.ts"
      - "src/core/repository-init.ts"
      - "src/commands/init.ts"
      - "src/commands/reconcile.ts"
      - "src/commands/integration-runtime.ts"

  visual:
    required: conditional
    paths: []

branches:
  worker_pattern: "agent/{issue}-{slug}"
  require_up_to_date: true

allocation:
  coordinator_only: true
  require_assignment: true
  require_worker_id: true
  one_active_pr_per_issue: true

dependencies:
  require_satisfied_before_integration: true

enforcement:
  prefer_hard_merge_gate: true

github:
  source_of_truth: true
