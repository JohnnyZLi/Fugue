name: Fugue Control Plane

on:
  issues:
    types: [opened, edited, labeled, unlabeled, reopened, closed]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, closed]
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: write
  id-token: write
  issues: write
  pull-requests: write
  statuses: write

# Issue-event runs use a run-specific group so GitHub's single-pending replacement cannot discard
# the only immutable Human event snapshot. Other event classes remain repository-serialized.
concurrency:
  group: ${{ github.event_name == 'issues' && format('fugue-control-plane-issue-{0}', github.run_id) || format('fugue-control-plane-{0}', github.repository) }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Reconcile durable Fugue state
        env:
          FUGUE_WORKFLOW_SHA: ${{ github.workflow_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node dist/cli.js reconcile
