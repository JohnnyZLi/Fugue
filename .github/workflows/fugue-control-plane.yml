name: Fugue Control Plane

on:
  issues:
    types: [opened, edited, labeled, unlabeled, reopened, closed]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, closed]
  workflow_run:
    workflows: [CI, Fugue Integration]
    types: [requested, completed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: write
  id-token: write
  issues: write
  pull-requests: write
  statuses: write

# Human issue snapshots and Integration lifecycle events each get a run-specific group so GitHub's
# single-pending replacement cannot discard their immutable event payloads. Other events stay serialized.
concurrency:
  group: ${{ (github.event_name == 'issues' || (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Fugue Integration')) && format('fugue-control-plane-event-{0}', github.run_id) || format('fugue-control-plane-{0}', github.repository) }}
  cancel-in-progress: false

jobs:
  reconcile:
    # CI requested events are not protocol authority. Fugue Integration requested events are the
    # protected early binding signal; all completed events retain their existing reconciliation path.
    if: github.event_name != 'workflow_run' || github.event.action == 'completed' || github.event.workflow_run.name == 'Fugue Integration'
    runs-on: ubuntu-latest
    # SECURITY INVARIANT (external): before the App private key is installed, repository admins
    # must configure fugue-authority to allow only the protected default branch. The audit below is
    # defense-in-depth drift detection after GitHub's environment gate; it cannot make a broad
    # environment safe against a candidate workflow that references that environment directly.
    environment: fugue-authority
    steps:
      - name: Audit external Fugue Authority environment invariant
        env:
          FUGUE_PROTECTED_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
          const branch = process.env.FUGUE_PROTECTED_BRANCH;
          if (!branch) throw new Error('Repository default branch is unavailable.');
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            'X-GitHub-Api-Version': '2022-11-28',
          };
          const base = `https://api.github.com/repos/${owner}/${repo}/environments/fugue-authority`;
          const environmentResponse = await fetch(base, { headers });
          if (!environmentResponse.ok) {
            throw new Error(`fugue-authority environment is unavailable (${environmentResponse.status}); authority remains fail-closed.`);
          }
          const environment = await environmentResponse.json();
          const deployment = environment.deployment_branch_policy;
          if (!deployment || deployment.protected_branches !== false || deployment.custom_branch_policies !== true) {
            throw new Error('fugue-authority must use an explicit custom deployment branch policy.');
          }
          const policiesResponse = await fetch(`${base}/deployment-branch-policies?per_page=100`, { headers });
          if (!policiesResponse.ok) throw new Error(`Unable to verify fugue-authority branch policy (${policiesResponse.status}).`);
          const policies = await policiesResponse.json();
          const names = (policies.branch_policies ?? []).map((policy) => policy.name).sort();
          if (names.length !== 1 || names[0] !== branch) {
            throw new Error(`fugue-authority must allow exactly protected branch ${branch}; found ${names.join(', ') || 'none'}.`);
          }
          NODE
      - name: Mint narrow Fugue Authority token
        id: fugue-authority
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FUGUE_AUTHORITY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FUGUE_AUTHORITY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: write
          permission-variables: write
      - name: Resolve Fugue Authority bot identity
        id: fugue-authority-actor
        env:
          GH_TOKEN: ${{ steps.fugue-authority.outputs.token }}
          APP_SLUG: ${{ steps.fugue-authority.outputs.app-slug }}
        run: |
          set -euo pipefail
          actor_json="$(gh api "/users/${APP_SLUG}[bot]")"
          actor_id="$(jq -er '.id | select(type == "number" and . > 0)' <<<"$actor_json")"
          actor_type="$(jq -er '.type' <<<"$actor_json")"
          if [[ "$actor_type" != "Bot" ]]; then
            echo "Fugue Authority App identity is not a GitHub Bot." >&2
            exit 1
          fi
          echo "id=$actor_id" >> "$GITHUB_OUTPUT"
      - name: Persist protected Integration binding witness
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Fugue Integration'
        env:
          FUGUE_AUTHORITY_TOKEN: ${{ steps.fugue-authority.outputs.token }}
          FUGUE_AUTHORITY_ACTOR_ID: ${{ steps.fugue-authority-actor.outputs.id }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';

          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const run = event.workflow_run ?? {};
          if (run.name !== 'Fugue Integration' || run.event !== 'workflow_dispatch' || Number(run.run_attempt) !== 1) process.exit(0);

          const match = String(run.display_title ?? '').match(
            /^Fugue Integration PR #(\d+) (int-[0-9a-f]{16}-[0-9a-f]{16}) ([0-9a-f]{24})$/,
          );
          if (!match?.[1] || !match[2] || !match[3]) throw new Error('Protected Integration workflow_run title is malformed.');
          const prNumber = Number(match[1]);
          const requestId = match[2];
          const runToken = match[3];
          const runId = Number(run.id);
          const actorId = Number(run.actor?.id);
          const expectedActorId = Number(process.env.FUGUE_AUTHORITY_ACTOR_ID);
          const runAttempt = Number(run.run_attempt);
          const headSha = String(run.head_sha ?? '');
          const runCreatedAt = String(run.created_at ?? '');
          const htmlUrl = String(run.html_url ?? '');
          const expectedHtmlUrl = `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${runId}`;
          if (!Number.isSafeInteger(prNumber) || prNumber <= 0 || !Number.isSafeInteger(runId) || runId <= 0 ||
              !Number.isSafeInteger(actorId) || actorId <= 0 || !Number.isSafeInteger(expectedActorId) || expectedActorId <= 0 ||
              actorId !== expectedActorId || run.actor?.type !== 'Bot' || runAttempt !== 1 ||
              !/^[0-9a-f]{40}$/i.test(headSha) || !Number.isFinite(Date.parse(runCreatedAt)) || htmlUrl !== expectedHtmlUrl) {
            throw new Error('Protected Integration workflow_run does not match the Fugue Authority App dispatch identity.');
          }

          const suffix = createHash('sha256').update(requestId, 'utf8').digest('hex').slice(0, 32).toUpperCase();
          const fenceName = `FUGUE_INT_F_${suffix}`;
          const bindingName = `FUGUE_INT_B_${suffix}`;
          const commitName = `FUGUE_INT_C_${suffix}`;
          const apiBase = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}`;
          const headers = {
            Authorization: `Bearer ${process.env.FUGUE_AUTHORITY_TOKEN}`,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
            'Content-Type': 'application/json',
          };
          async function request(path, init = {}) {
            return fetch(`${apiBase}${path}`, { ...init, headers: { ...headers, ...(init.headers ?? {}) } });
          }
          async function readVariable(name, allow404 = false) {
            const response = await request(`/actions/variables/${encodeURIComponent(name)}`);
            if (allow404 && response.status === 404) return null;
            const body = await response.text();
            if (!response.ok) throw new Error(`Fugue Authority API ${response.status} reading ${name}: ${body.slice(0, 300)}`);
            const value = body ? JSON.parse(body).value : undefined;
            if (typeof value !== 'string') throw new Error(`Protected Fugue Authority variable ${name} has no string value.`);
            return value;
          }
          async function createVariable(name, value) {
            const response = await request('/actions/variables', {
              method: 'POST',
              body: JSON.stringify({ name, value }),
            });
            if (response.status !== 201 && response.status !== 409 && response.status !== 422) {
              throw new Error(`Unable to create protected Integration variable ${name} (${response.status}).`);
            }
          }

          const fenceRaw = await readVariable(fenceName, true);
          // A durable exact binding or terminal authority may already have committed and reclaimed F.
          // In that case this delayed workflow_run delivery is presentation only and cannot reopen it.
          if (fenceRaw === null) process.exit(0);
          let fence;
          try { fence = JSON.parse(fenceRaw); }
          catch { throw new Error('Protected Integration dispatch fence is malformed.'); }
          if (fence?.version !== 1 || fence?.kind !== 'integration_dispatch_fence' || fence.request_id !== requestId ||
              fence.pr_number !== prNumber || fence.base_sha?.toLowerCase() !== headSha.toLowerCase() ||
              fence.run_token !== runToken || fence.authority_actor_id !== expectedActorId ||
              typeof fence.head_sha !== 'string' || typeof fence.anchor_name !== 'string' || typeof fence.created_at !== 'string') {
            throw new Error('Protected Integration workflow_run conflicts with its immutable dispatch fence.');
          }

          // C is the request-local first-writer-wins serialization point shared by exact-L writers
          // and identity_lost terminalization. Claim it before publishing B so a legitimate exact L
          // that wins this create cannot be suppressed by a stale terminalizer.
          const exactCommit = {
            version: 1,
            kind: 'integration_exact_run_commit',
            request_id: requestId,
            pr_number: prNumber,
            head_sha: fence.head_sha,
            base_sha: fence.base_sha,
            anchor_name: fence.anchor_name,
            run_id: runId,
            run_attempt: 1,
            run_created_at: runCreatedAt,
            html_url: htmlUrl,
          };
          const serializedCommit = JSON.stringify(exactCommit);
          await createVariable(commitName, serializedCommit);
          const committedRaw = await readVariable(commitName);
          let committed;
          try { committed = JSON.parse(committedRaw); }
          catch { throw new Error('Protected Integration request-local commit is malformed.'); }
          if (committed?.kind === 'integration_identity_lost_commit') process.exit(0);
          if (committed?.version !== 1 || committed?.kind !== 'integration_exact_run_commit' ||
              committed.request_id !== requestId || committed.pr_number !== prNumber ||
              committed.head_sha?.toLowerCase() !== fence.head_sha.toLowerCase() ||
              committed.base_sha?.toLowerCase() !== fence.base_sha.toLowerCase() ||
              committed.anchor_name !== fence.anchor_name || committed.run_id !== runId || committed.run_attempt !== 1 ||
              committed.run_created_at !== runCreatedAt || committed.html_url !== htmlUrl) {
            throw new Error('Protected Integration request-local commit was already claimed by another run.');
          }

          const witness = {
            version: 1,
            kind: 'integration_binding_witness',
            request_id: requestId,
            pr_number: prNumber,
            head_sha: fence.head_sha,
            base_sha: fence.base_sha,
            anchor_name: fence.anchor_name,
            run_token: fence.run_token,
            authority_actor_id: fence.authority_actor_id,
            run_id: runId,
            run_attempt: 1,
            run_created_at: runCreatedAt,
            html_url: htmlUrl,
          };
          const serialized = JSON.stringify(witness);
          await createVariable(bindingName, serialized);
          const witnessCommitted = await readVariable(bindingName);
          if (witnessCommitted !== serialized) {
            throw new Error('Protected Integration binding witness was already claimed by a different run.');
          }
          NODE
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Reconcile durable Fugue state
        env:
          FUGUE_WORKFLOW_SHA: ${{ github.workflow_sha }}
          FUGUE_AUTHORITY_TOKEN: ${{ steps.fugue-authority.outputs.token }}
          FUGUE_AUTHORITY_ACTOR_ID: ${{ steps.fugue-authority-actor.outputs.id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node dist/cli.js reconcile