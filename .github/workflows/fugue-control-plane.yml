name: Fugue Control Plane

on:
  issues:
    types: [opened, edited, labeled, unlabeled, reopened, closed]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, closed]
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: write
  id-token: write
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: fugue-control-plane-${{ github.repository }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Reconcile durable Fugue state
        env:
          FUGUE_EVENT_NAME: ${{ github.event_name }}
          FUGUE_EVENT_ACTION: ${{ github.event.action }}
          FUGUE_EVENT_ACTOR: ${{ github.event.sender.login }}
          FUGUE_EVENT_ISSUE: ${{ github.event.issue.number }}
          FUGUE_EVENT_LABEL: ${{ github.event.label.name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node dist/cli.js reconcile
