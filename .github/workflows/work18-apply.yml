name: Work 18 Gated Repair Apply

on:
  push:
    branches:
      - bootstrap/work18-worker-repair-20260818

permissions:
  contents: write
  issues: read

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[work18-apply]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/work18-worker-repair-20260818
          path: control
      - uses: actions/checkout@v4
        with:
          ref: agent/18-migrate-fugue-to-chat-first-github-hosted-orchestration
          path: work
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: work/package-lock.json
      - name: Confirm exact assignment and current Issue identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git -C work rev-parse HEAD)" = "2c83b6c61167ac8714067fcbe6860fe3183dbb17"
          gh api repos/JohnnyZLi/Fugue/issues/18 --jq .body > /tmp/issue-body.txt
          test "$(gh api repos/JohnnyZLi/Fugue/issues/18 --jq .updated_at)" = "2026-08-18T04:28:24Z"
          cd work && npm ci
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import crypto from 'node:crypto'; import { parse as parseYaml } from 'yaml';
          const body=fs.readFileSync('/tmp/issue-body.txt','utf8'); const sm='<!-- fugue-work'; const em='-->'; const s=body.indexOf(sm); const e=body.indexOf(em,s+sm.length); if(s<0||e<0) throw new Error('missing metadata');
          const m=parseYaml(body.slice(s+sm.length,e).trim());
          if(m.execution?.worker_id!=='wkr-b0057a9e'||m.execution?.branch!=='agent/18-migrate-fugue-to-chat-first-github-hosted-orchestration'||!m.spec?.ownership?.owned?.includes('tests/state-authority-blockers.test.ts')) throw new Error('assignment drift');
          const req=`${body.slice(0,s)}${body.slice(e+em.length)}`.replace(/\r\n?/g,'\n').split('\n').map(x=>x.replace(/[ \t]+$/g,'')).join('\n').trim();
          const sort=v=>Array.isArray(v)?v.map(sort):v&&typeof v==='object'?Object.fromEntries(Object.entries(v).sort(([a],[b])=>a.localeCompare(b)).map(([k,x])=>[k,sort(x)])):v;
          const digest='sha256:'+crypto.createHash('sha256').update(JSON.stringify(sort({requirements:req,spec:m.spec})),'utf8').digest('hex');
          if(digest!=='sha256:d68ce1214ed0aee5e8d1cad0539d535ef2c9d7ce90ea1a74be06359e0c6953e1') throw new Error(`work-spec drift: ${digest}`);
          NODE
      - name: Apply repairs
        run: python3 control/.github/work18-repair.py work
      - name: Typecheck
        run: cd work && npm run check
      - name: Test
        run: cd work && npm test
      - name: Build
        run: cd work && npm run build
      - name: Commit only after full validation
        run: |
          cd work
          git config user.name Johnny
          git config user.email 92900710+JohnnyZLi@users.noreply.github.com
          git add src/core/state.ts src/core/integration-plan.ts src/core/integration-status.ts src/core/reconcile.ts src/core/submissions.ts src/core/integration.ts src/core/workflow.ts .github/workflows/fugue-integration.yml tests/state-authority-blockers.test.ts AGENTS.md README.md docs/leader-chat.md
          git diff --cached --check
          git commit -m 'Close remaining QA transaction blockers'
          git push origin HEAD:agent/18-migrate-fugue-to-chat-first-github-hosted-orchestration
      - name: Record successful pushed head
        if: success()
        run: |
          cd control
          git pull --ff-only origin bootstrap/work18-worker-repair-20260818 || true
          echo "run_id=${{ github.run_id }}" > .github/work18-apply-result.txt
          echo "status=success" >> .github/work18-apply-result.txt
          echo "worker_head=$(git -C ../work rev-parse HEAD)" >> .github/work18-apply-result.txt
          echo "work_spec_digest=sha256:d68ce1214ed0aee5e8d1cad0539d535ef2c9d7ce90ea1a74be06359e0c6953e1" >> .github/work18-apply-result.txt
          git config user.name Johnny
          git config user.email 92900710+JohnnyZLi@users.noreply.github.com
          git add .github/work18-apply-result.txt
          git commit -m 'Record work-18 repair apply result'
          git push origin HEAD:bootstrap/work18-worker-repair-20260818

  record-failure:
    needs: apply
    if: always() && needs.apply.result == 'failure' && contains(github.event.head_commit.message, '[work18-apply]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/work18-worker-repair-20260818
      - run: |
          echo "run_id=${{ github.run_id }}" > .github/work18-apply-result.txt
          echo "status=failure" >> .github/work18-apply-result.txt
          git config user.name Johnny
          git config user.email 92900710+JohnnyZLi@users.noreply.github.com
          git add .github/work18-apply-result.txt
          git commit -m 'Record failed work-18 repair apply' || exit 0
          git push origin HEAD:bootstrap/work18-worker-repair-20260818
