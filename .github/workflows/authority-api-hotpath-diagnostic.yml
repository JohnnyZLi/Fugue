name: Authority API Hotpath Diagnostic

on:
  push:
    branches:
      - bootstrap/work18-status-bridge-20260819

permissions:
  contents: read
  statuses: write

jobs:
  inspect:
    if: github.event.head_commit.message == '[bootstrap] map Authority Variables hot path'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fc1620432f774a98a3798fb0f7c44076c2384a78
          persist-credentials: false
      - name: Publish static call sites
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const repo = process.env.GITHUB_REPOSITORY;
          const sha = process.env.GITHUB_SHA;
          const lines = readFileSync('src/core/state.ts','utf8').split(/\r?\n/);
          const hits = [];
          for (let i=0;i<lines.length;i++) {
            if (lines[i].includes('listFugueAuthorityVariables(')) hits.push([i+1, lines[i].trim()]);
          }
          const headers = {
            Accept:'application/vnd.github+json', Authorization:`Bearer ${process.env.GITHUB_TOKEN}`,
            'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'
          };
          for (const [line,text] of hits) {
            const r = await fetch(`https://api.github.com/repos/${repo}/statuses/${sha}`, {
              method:'POST',headers,body:JSON.stringify({state:'success',context:`fugue/diag/list-vars/L${line}`,description:text.slice(0,140)})
            });
            if(!r.ok) throw new Error(`status ${line} failed ${r.status}`);
          }
          const loops = lines.map((line,i)=>[i+1,line.trim()]).filter(([i,line]) => /for \(|while \(|RECOVERY_.*LIMIT|DURABLE_WRITE_ATTEMPTS/.test(String(line)) && i > 500);
          for (const [line,text] of loops.slice(0,80)) {
            const r = await fetch(`https://api.github.com/repos/${repo}/statuses/${sha}`, {
              method:'POST',headers,body:JSON.stringify({state:'success',context:`fugue/diag/loop/L${line}`,description:String(text).slice(0,140)})
            });
            if(!r.ok) throw new Error(`loop status ${line} failed ${r.status}`);
          }
          NODE
