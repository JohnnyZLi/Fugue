name: Fugue Authority Environment Diagnostic

on:
  push:
    branches:
      - bootstrap/work18-status-bridge-20260819

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect environment without mutating it
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const repo = process.env.GITHUB_REPOSITORY;
          const sha = process.env.GITHUB_SHA;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            'X-GitHub-Api-Version': '2026-03-10',
          };
          const base = `https://api.github.com/repos/${repo}`;
          async function get(path) {
            const r = await fetch(`${base}${path}`, { headers });
            const text = await r.text();
            let body = null;
            try { body = text ? JSON.parse(text) : null; } catch {}
            return { status: r.status, body };
          }
          const env = await get('/environments/fugue-authority');
          let state = 'failure';
          let category = 'unknown';
          let description;
          if (env.status === 404) {
            category = 'missing';
            description = 'fugue-authority environment missing';
          } else if (env.status !== 200) {
            category = `read-${env.status}`;
            description = `environment read failed (${env.status})`;
          } else {
            const d = env.body?.deployment_branch_policy;
            if (!d || d.protected_branches !== false || d.custom_branch_policies !== true) {
              category = 'broad';
              description = 'environment exists but custom branch policy is not enabled';
            } else {
              const policies = await get('/environments/fugue-authority/deployment-branch-policies?per_page=100');
              if (policies.status !== 200) {
                category = `policy-read-${policies.status}`;
                description = `branch-policy read failed (${policies.status})`;
              } else {
                const names = (policies.body?.branch_policies ?? []).map(p => p.name).sort();
                if (names.length === 1 && names[0] === 'main') {
                  state = 'success';
                  category = 'main-only';
                  description = 'fugue-authority restricted exactly to main';
                } else {
                  category = names.length ? `branches-${names.join('-')}` : 'branches-empty';
                  description = `branch policy is ${names.join(',') || 'empty'}, expected main only`;
                }
              }
            }
          }
          const statusResponse = await fetch(`${base}/statuses/${sha}`, {
            method: 'POST',
            headers: { ...headers, 'Content-Type': 'application/json' },
            body: JSON.stringify({
              state,
              context: `fugue/bootstrap-authority-env/${category}`.slice(0, 100),
              description: description.slice(0, 140),
            }),
          });
          if (!statusResponse.ok) throw new Error(`status publish failed: ${statusResponse.status}`);
          console.log(description);
          NODE
