name: Work 18 Mandatory Guard Apply

on:
  push:
    branches:
      - bootstrap/fugue-work18-validation

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[guard-apply]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/fugue-work18-validation
          path: control
      - uses: actions/checkout@v4
        with:
          ref: agent/18-migrate-fugue-to-chat-first-github-hosted-orchestration
          path: work
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: work/package-lock.json
      - name: Confirm exact Worker head
        run: test "$(git -C work rev-parse HEAD)" = "d4320f18fa60e8ad78288dc8ab365bc929c6ec48"
      - name: Apply mandatory guard refinement
        run: python3 control/.github/work18-worker-guard-slot.py work
      - run: cd work && npm ci
      - run: cd work && npm run check
      - run: cd work && npm test
      - run: cd work && npm run build
      - name: Commit refinement
        run: |
          cd work
          git config user.name Johnny
          git config user.email 92900710+JohnnyZLi@users.noreply.github.com
          git add src/core/state.ts tests/reconcile.test.ts AGENTS.md README.md docs/leader-chat.md
          git diff --cached --check
          git commit -m 'Make recovery mutation guard mandatory'
          git push origin HEAD:agent/18-migrate-fugue-to-chat-first-github-hosted-orchestration
          git rev-parse HEAD > ../guard-head.txt
      - name: Record result
        if: always()
        run: |
          cd control
          git pull --ff-only origin bootstrap/fugue-work18-validation || true
          {
            echo "run_id=${{ github.run_id }}"
            echo "job_status=${{ job.status }}"
            test -f ../guard-head.txt && echo "worker_head=$(cat ../guard-head.txt)" || true
          } > .github/work18-guard-apply-result.txt
          git config user.name Johnny
          git config user.email 92900710+JohnnyZLi@users.noreply.github.com
          git add .github/work18-guard-apply-result.txt
          git commit -m 'Record mandatory guard apply result' || exit 0
          git push origin HEAD:bootstrap/fugue-work18-validation
