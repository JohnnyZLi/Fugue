# final-trigger
name: Work18 Cleanup Lifecycle Final V5

on:
  push:
    branches: [bootstrap/work18-identity-lost-20260818]

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[cleanup-final-v5]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/18-migrate-fugue-to-chat-first-github-hosted-orchestration
          path: work
          fetch-depth: 8
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/work18-identity-lost-20260818
          path: helper
          fetch-depth: 1
      - name: Apply final historical cleanup hardening
        working-directory: work
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 6cfec15202464a5b8d0a0e0ad1a589f62675aae2 HEAD
          test -z "$(git diff --name-only 6cfec15202464a5b8d0a0e0ad1a589f62675aae2 HEAD | grep -v '^src/core/integration-status.ts$' || true)"
          python ../helper/.github/work18-cleanup-final-v5.py
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' 'src/core/integration-status.ts' 'tests/state-authority-blockers.test.ts' | sort)"
          test "$changed" = "$expected"
          ! git diff --name-only e8ebca4f528c7e8657e6418448f551004e77fbaa HEAD | grep -Fx package-lock.json
          git diff --check
          npm ci
          npm run check
          npm test
          npm run build
          git config user.name Johnny
          git config user.email 92900710+JohnnyZLi@users.noreply.github.com
          git add src/core/integration-status.ts tests/state-authority-blockers.test.ts
          git diff --cached --check
          git commit -m 'Finish historical Integration cleanup hardening'
          git push origin HEAD:agent/18-migrate-fugue-to-chat-first-github-hosted-orchestration
      - id: head
        name: Resolve final exact head
        working-directory: work
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  test:
    needs: repair
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.repair.outputs.sha }}
          persist-credentials: false
      - name: Confirm detached exact head and no publication credential
        env:
          EXPECTED_SHA: ${{ needs.repair.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git symbolic-ref -q HEAD || true)"
          test -z "$(git config --local --get-regexp 'http.*extraheader' || true)"
          test -z "$GITHUB_TOKEN"
          test -z "$GH_TOKEN"
          ! git diff --name-only e8ebca4f528c7e8657e6418448f551004e77fbaa HEAD | grep -Fx package-lock.json
          test ! -e src/core/integration-commit.ts
          test ! -e tests/integration-terminal-serialization.test.ts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  record:
    needs: [repair, test]
    if: always() && contains(github.event.head_commit.message, '[cleanup-final-v5]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/work18-identity-lost-20260818
      - name: Record result
        run: |
          set -euo pipefail
          printf 'run_id=%s\ntest_result=%s\nvalidated_sha=%s\nwork_spec_digest=%s\n' '${{ github.run_id }}' '${{ needs.test.result }}' '${{ needs.repair.outputs.sha }}' 'sha256:249cd537997213f217727edfc9c86d2b41d7447219c1ee886ee4c61a9e6ee985' > .github/work18-cleanup-final-v5-result.txt
          git config user.name Johnny
          git config user.email 92900710+JohnnyZLi@users.noreply.github.com
          git add .github/work18-cleanup-final-v5-result.txt
          git commit -m 'Record cleanup lifecycle final v5 validation' || exit 0
          git push origin HEAD:bootstrap/work18-identity-lost-20260818
