name: Work 20 Authority Token Hotfix

on:
  push:
    branches:
      - agent/20-fix-fugue-authority-token-bootstrap

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == '[work-20] apply authority token hotfix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply scoped workflow fix and regression
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in [
              '.github/workflows/fugue-control-plane.yml',
              '.github/workflows/fugue-integration.yml',
          ]:
              path = Path(name)
              text = path.read_text()
              text = text.replace('          permission-actions: write\n', '')
              text = text.replace('          permission-variables: write\n', '')
              path.write_text(text)

          test = Path('tests/ci.test.ts')
          text = test.read_text()
          marker = 'describe("Fugue Authority App token workflow configuration"'
          if marker not in text:
              text += '''\n\ndescribe("Fugue Authority App token workflow configuration", () => {\n  it("inherits the deliberately narrow App installation permissions instead of using unsupported permission selectors", async () => {\n    for (const path of [\n      ".github/workflows/fugue-control-plane.yml",\n      ".github/workflows/fugue-integration.yml",\n    ]) {\n      const workflow = await readFile(path, "utf8");\n      expect(workflow).toContain("actions/create-github-app-token@v3");\n      expect(workflow).toContain("FUGUE_AUTHORITY_APP_CLIENT_ID");\n      expect(workflow).toContain("FUGUE_AUTHORITY_APP_PRIVATE_KEY");\n      expect(workflow).not.toContain("permission-variables:");\n      expect(workflow).not.toContain("permission-actions:");\n    }\n  });\n});\n'''
              test.write_text(text)

          Path('.github/workflows/work20-authority-token-hotfix.yml').unlink()
          PY
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/fugue-control-plane.yml .github/workflows/fugue-integration.yml tests/ci.test.ts .github/workflows/work20-authority-token-hotfix.yml
          git commit -m '[work-20] Fix Fugue Authority token permission minting'
          git push origin HEAD:agent/20-fix-fugue-authority-token-bootstrap
