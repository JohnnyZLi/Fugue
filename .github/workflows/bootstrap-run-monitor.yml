name: Bootstrap Run Monitor

on:
  push:
    branches:
      - bootstrap/work18-status-bridge-20260819

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  monitor:
    if: github.event.head_commit.message == '[bootstrap] inspect post-merge control queue'
    runs-on: ubuntu-latest
    steps:
      - name: Publish recent post-merge control-plane runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const repo = process.env.GITHUB_REPOSITORY;
          const sha = process.env.GITHUB_SHA;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            'X-GitHub-Api-Version': '2022-11-28',
            'Content-Type': 'application/json',
          };
          const r = await fetch(`https://api.github.com/repos/${repo}/actions/workflows/fugue-control-plane.yml/runs?per_page=30`, { headers });
          const body = await r.json();
          if (!r.ok) throw new Error(`list control-plane runs failed ${r.status}`);
          const runs = (body.workflow_runs ?? []).filter(x => x.head_branch === 'main' && Date.parse(x.created_at) >= Date.parse('2026-08-19T18:57:00Z')).slice(0, 10);
          if (!runs.length) throw new Error('No post-merge control-plane runs found.');
          for (const run of runs) {
            const state = run.status === 'completed' && run.conclusion === 'success' ? 'success' : run.status === 'completed' ? 'failure' : 'pending';
            const context = `fugue/bootstrap-control-queue/${run.id}`;
            const desc = `${run.event} ${run.status}/${run.conclusion ?? 'none'} ${run.created_at}`.slice(0, 140);
            const s = await fetch(`https://api.github.com/repos/${repo}/statuses/${sha}`, {
              method: 'POST', headers,
              body: JSON.stringify({ state, context, description: desc, target_url: run.html_url }),
            });
            if (!s.ok) throw new Error(`status publish failed ${s.status}`);
          }
          NODE
