name: Bootstrap Run Monitor

on:
  push:
    branches:
      - bootstrap/work18-status-bridge-20260819

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  monitor:
    if: github.event.head_commit.message == '[bootstrap] monitor post-merge Authority smoke test'
    runs-on: ubuntu-latest
    steps:
      - name: Publish newest post-merge control-plane run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const repo = process.env.GITHUB_REPOSITORY;
          const sha = process.env.GITHUB_SHA;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            'X-GitHub-Api-Version': '2022-11-28',
            'Content-Type': 'application/json',
          };
          const r = await fetch(`https://api.github.com/repos/${repo}/actions/workflows/fugue-control-plane.yml/runs?event=issue_comment&per_page=20`, { headers });
          const body = await r.json();
          if (!r.ok) throw new Error(`list control-plane runs failed ${r.status}`);
          const run = (body.workflow_runs ?? []).find(x => x.head_branch === 'main' && Date.parse(x.created_at) >= Date.parse('2026-08-19T18:57:26Z'));
          if (!run) throw new Error('No post-merge issue_comment control-plane run found.');
          const state = run.status === 'completed' && run.conclusion === 'success' ? 'success' : run.status === 'completed' ? 'failure' : 'pending';
          const s = await fetch(`https://api.github.com/repos/${repo}/statuses/${sha}`, {
            method: 'POST', headers,
            body: JSON.stringify({
              state,
              context: `fugue/bootstrap-postmerge-control/${run.id}`,
              description: `${run.status}/${run.conclusion ?? 'none'} ${run.head_sha}`.slice(0, 140),
              target_url: run.html_url,
            }),
          });
          if (!s.ok) throw new Error(`status publish failed ${s.status}`);
          NODE
