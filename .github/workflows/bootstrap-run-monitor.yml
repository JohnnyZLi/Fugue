name: Bootstrap Run Monitor

on:
  push:
    branches:
      - bootstrap/work18-status-bridge-20260819

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  monitor:
    if: github.event.head_commit.message == '[bootstrap] monitor PR23 ack control plane'
    runs-on: ubuntu-latest
    steps:
      - name: Publish recent protected control-plane runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const repo = process.env.GITHUB_REPOSITORY;
          const sha = process.env.GITHUB_SHA;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            'X-GitHub-Api-Version': '2022-11-28',
            'Content-Type': 'application/json',
          };
          const r = await fetch(`https://api.github.com/repos/${repo}/actions/workflows/fugue-control-plane.yml/runs?event=issue_comment&per_page=10`, { headers });
          const body = await r.json();
          if (!r.ok) throw new Error(`list control-plane runs failed ${r.status}`);
          for (const run of (body.workflow_runs ?? []).filter(x => x.head_branch === 'main').slice(0, 5)) {
            const state = run.status === 'completed' && run.conclusion === 'success' ? 'success' : run.status === 'completed' ? 'failure' : 'pending';
            const s = await fetch(`https://api.github.com/repos/${repo}/statuses/${sha}`, {
              method: 'POST', headers,
              body: JSON.stringify({
                state,
                context: `fugue/bootstrap-pr23-ack-control/${run.id}`,
                description: `${run.status}/${run.conclusion ?? 'none'} ${run.created_at}`.slice(0, 140),
                target_url: run.html_url,
              }),
            });
            if (!s.ok) throw new Error(`status publish failed ${s.status}`);
          }
          NODE
