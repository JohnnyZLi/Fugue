name: Bootstrap Run Monitor

on:
  push:
    branches:
      - bootstrap/work18-status-bridge-20260819

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  monitor:
    if: github.event.head_commit.message == '[bootstrap] expose helper run ids'
    runs-on: ubuntu-latest
    steps:
      - name: Publish latest helper run identities
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const repo = process.env.GITHUB_REPOSITORY;
          const sha = process.env.GITHUB_SHA;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            'X-GitHub-Api-Version': '2022-11-28',
            'Content-Type': 'application/json',
          };
          const r = await fetch(`https://api.github.com/repos/${repo}/actions/runs?branch=${encodeURIComponent('bootstrap/work18-status-bridge-20260819')}&per_page=100`, { headers });
          const body = await r.json();
          if (!r.ok) throw new Error(`list runs failed ${r.status}`);
          const names = new Set(['Work 20 Branch Patcher', 'Work 20 Checkout Patcher']);
          const selected = [];
          for (const run of body.workflow_runs ?? []) {
            if (!names.has(run.name)) continue;
            if (selected.some(x => x.name === run.name)) continue;
            selected.push(run);
          }
          for (const run of selected) {
            const slug = run.name.includes('Checkout') ? 'checkout' : 'api';
            const state = run.status === 'completed' && run.conclusion === 'success' ? 'success' : run.status === 'completed' ? 'failure' : 'pending';
            const s = await fetch(`https://api.github.com/repos/${repo}/statuses/${sha}`, {
              method: 'POST', headers,
              body: JSON.stringify({
                state,
                context: `fugue/bootstrap-helper-${slug}/${run.id}`,
                description: `${run.status}/${run.conclusion ?? 'none'}`,
                target_url: run.html_url,
              }),
            });
            if (!s.ok) throw new Error(`status publish failed ${s.status}`);
          }
          NODE
