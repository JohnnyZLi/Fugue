name: Bootstrap Run Monitor

on:
  push:
    branches:
      - bootstrap/work18-status-bridge-20260819

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  monitor:
    if: github.event.head_commit.message == '[bootstrap] monitor PR23 integration bridge'
    runs-on: ubuntu-latest
    steps:
      - name: Publish newest PR23 integration bridge run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const repo = process.env.GITHUB_REPOSITORY;
          const sha = process.env.GITHUB_SHA;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            'X-GitHub-Api-Version': '2022-11-28',
            'Content-Type': 'application/json',
          };
          const r = await fetch(`https://api.github.com/repos/${repo}/actions/workflows/pr23-integration-bootstrap.yml/runs?event=push&per_page=10`, { headers });
          const body = await r.json();
          if (!r.ok) throw new Error(`list bridge runs failed ${r.status}`);
          const run = (body.workflow_runs ?? []).find(x => x.head_sha === 'dd9cf59d57c3e7b8f0c6382dea8051a5bdc65bb0');
          if (!run) throw new Error('No PR23 bridge run found for exact trigger commit.');
          const state = run.status === 'completed' && run.conclusion === 'success' ? 'success' : run.status === 'completed' ? 'failure' : 'pending';
          const s = await fetch(`https://api.github.com/repos/${repo}/statuses/${sha}`, {
            method: 'POST', headers,
            body: JSON.stringify({
              state,
              context: `fugue/bootstrap-pr23-integration/${run.id}`,
              description: `${run.status}/${run.conclusion ?? 'none'} attempt ${run.run_attempt}`,
              target_url: run.html_url,
            }),
          });
          if (!s.ok) throw new Error(`status publish failed ${s.status}`);
          NODE
