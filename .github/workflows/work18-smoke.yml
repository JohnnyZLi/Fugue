name: Work18 Bootstrap Smoke
on:
  push:
    branches: [bootstrap/work18-identity-lost-20260818]
jobs:
  smoke:
    if: contains(github.event.head_commit.message, '[work18-smoke]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/work18-identity-lost-20260818
      - run: |
          set -euo pipefail
          echo "run_id=${GITHUB_RUN_ID}" > .github/work18-smoke-result.txt
          git config user.name Johnny
          git config user.email 92900710+JohnnyZLi@users.noreply.github.com
          git add .github/work18-smoke-result.txt
          git commit -m 'Record work18 smoke result' || exit 0
          git push origin HEAD:bootstrap/work18-identity-lost-20260818
