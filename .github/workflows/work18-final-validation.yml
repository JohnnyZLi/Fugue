name: Work 18 Consolidated Exact-Head Validation

on:
  push:
    branches: [bootstrap/work18-consolidation-20260818]

jobs:
  test:
    if: contains(github.event.head_commit.message, '[work18-final-validate]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 802dca5df1c05a35d659472929efef60f450a36f
          persist-credentials: false
      - name: Confirm detached exact head and no publication credential
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 802dca5df1c05a35d659472929efef60f450a36f
          test -z "$(git symbolic-ref -q HEAD || true)"
          test -z "$(git config --local --get-regexp 'http.*extraheader' || true)"
          test -z "$GITHUB_TOKEN"
          test -z "$GH_TOKEN"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  record:
    needs: test
    if: always() && contains(github.event.head_commit.message, '[work18-final-validate]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/work18-consolidation-20260818
      - name: Record result
        run: |
          printf 'run_id=%s\ntest_result=%s\nvalidated_sha=%s\nwork_spec_digest=%s\n' '${{ github.run_id }}' '${{ needs.test.result }}' '802dca5df1c05a35d659472929efef60f450a36f' 'sha256:d68ce1214ed0aee5e8d1cad0539d535ef2c9d7ce90ea1a74be06359e0c6953e1' > .github/work18-final-validation-result.txt
          git config user.name Johnny
          git config user.email 92900710+JohnnyZLi@users.noreply.github.com
          git add .github/work18-final-validation-result.txt
          git commit -m 'Record work-18 final validation' || exit 0
          git push origin HEAD:bootstrap/work18-consolidation-20260818
