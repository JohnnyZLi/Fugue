name: Work 18 Reconstruction

on:
  push:
    branches:
      - bootstrap/work18-worker-repair-20260818

permissions:
  contents: write
  issues: read

jobs:
  reconstruct:
    if: contains(github.event.head_commit.message, '[work18-reconstruct]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/work18-worker-repair-20260818
          path: control
      - uses: actions/checkout@v4
        with:
          ref: agent/18-migrate-fugue-to-chat-first-github-hosted-orchestration
          path: work
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: work/package-lock.json
      - name: Reconstruct current Issue identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd work
          npm ci
          gh api repos/JohnnyZLi/Fugue/issues/18 --jq .body > /tmp/issue-body.txt
          gh api repos/JohnnyZLi/Fugue/issues/18 --jq .updated_at > /tmp/issue-updated.txt
          node --input-type=module <<'NODE' > /tmp/digest.txt
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { parse as parseYaml } from 'yaml';
          const body = fs.readFileSync('/tmp/issue-body.txt', 'utf8');
          const startMarker = '<!-- fugue-work';
          const endMarker = '-->';
          const start = body.indexOf(startMarker);
          if (start < 0) throw new Error('missing fugue-work metadata');
          const end = body.indexOf(endMarker, start + startMarker.length);
          if (end < 0) throw new Error('unterminated fugue-work metadata');
          const yaml = body.slice(start + startMarker.length, end).trim();
          const metadata = parseYaml(yaml);
          const requirements = `${body.slice(0,start)}${body.slice(end + endMarker.length)}`
            .replace(/\r\n?/g, '\n')
            .split('\n').map((line) => line.replace(/[ \t]+$/g, '')).join('\n').trim();
          const sortValue = (value) => Array.isArray(value) ? value.map(sortValue) :
            value && typeof value === 'object' ? Object.fromEntries(Object.entries(value).sort(([a],[b]) => a.localeCompare(b)).map(([k,v]) => [k, sortValue(v)])) : value;
          const canonical = JSON.stringify(sortValue({ requirements, spec: metadata.spec }));
          const digest = 'sha256:' + crypto.createHash('sha256').update(canonical, 'utf8').digest('hex');
          console.log(digest);
          console.error(`worker_id=${metadata.execution?.worker_id ?? ''}`);
          console.error(`branch=${metadata.execution?.branch ?? ''}`);
          console.error(`owns_blocker_test=${metadata.spec?.ownership?.owned?.includes('tests/state-authority-blockers.test.ts')}`);
          NODE
          cd ../control
          {
            echo "worker_head=$(git -C ../work rev-parse HEAD)"
            echo "work_spec_digest=$(cat /tmp/digest.txt)"
            echo "issue_updated_at=$(cat /tmp/issue-updated.txt)"
            grep '^worker_id=' /tmp/digest.txt 2>/dev/null || true
          } > .github/work18-current-digest.txt
          # stderr from the node script is not captured above; resolve metadata directly for the stable fields.
          cd ../work
          node --input-type=module <<'NODE' >> ../control/.github/work18-current-digest.txt
          import fs from 'node:fs'; import { parse as parseYaml } from 'yaml';
          const body=fs.readFileSync('/tmp/issue-body.txt','utf8'); const s=body.indexOf('<!-- fugue-work'); const e=body.indexOf('-->',s+1); const m=parseYaml(body.slice(s+'<!-- fugue-work'.length,e).trim());
          console.log(`worker_id=${m.execution?.worker_id ?? ''}`); console.log(`worker_branch=${m.execution?.branch ?? ''}`); console.log(`owns_blocker_test=${m.spec?.ownership?.owned?.includes('tests/state-authority-blockers.test.ts')}`);
          NODE
          cd ../control
          git config user.name Johnny
          git config user.email 92900710+JohnnyZLi@users.noreply.github.com
          git add .github/work18-current-digest.txt
          git commit -m 'Record current work-18 reconstruction'
          git push origin HEAD:bootstrap/work18-worker-repair-20260818
