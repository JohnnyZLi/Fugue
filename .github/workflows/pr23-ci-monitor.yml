name: PR 23 CI Monitor

on:
  push:
    branches:
      - bootstrap/work18-status-bridge-20260819

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  locate:
    if: github.event.head_commit.message == '[bootstrap] locate PR 23 protected CI'
    runs-on: ubuntu-latest
    steps:
      - name: Find protected CI run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_TITLE: CI PR #23 @ 77bed0f66820d18e3d1b43250ac22de4d8516dc3
        run: |
          node --input-type=module <<'NODE'
          const repo = process.env.GITHUB_REPOSITORY;
          const sha = process.env.GITHUB_SHA;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            'X-GitHub-Api-Version': '2022-11-28',
            'Content-Type': 'application/json',
          };
          const r = await fetch(`https://api.github.com/repos/${repo}/actions/workflows/ci.yml/runs?event=pull_request_target&per_page=50`, { headers });
          const body = await r.json();
          if (!r.ok) throw new Error(`list CI runs failed ${r.status}`);
          const run = (body.workflow_runs ?? []).find(x => x.display_title === process.env.TARGET_TITLE);
          if (!run) throw new Error(`No protected CI run found for ${process.env.TARGET_TITLE}`);
          const state = run.status === 'completed' && run.conclusion === 'success' ? 'success' : run.status === 'completed' ? 'failure' : 'pending';
          const s = await fetch(`https://api.github.com/repos/${repo}/statuses/${sha}`, {
            method: 'POST', headers,
            body: JSON.stringify({
              state,
              context: `fugue/bootstrap-pr23-ci/${run.id}`,
              description: `${run.status}/${run.conclusion ?? 'none'}`,
              target_url: run.html_url,
            }),
          });
          if (!s.ok) throw new Error(`status publish failed ${s.status}`);
          NODE
