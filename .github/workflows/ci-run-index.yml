name: CI Run Index
# Refresh target: PR 23 @ 3bfce4146a16e0e33bd423f9c2d18a03a81e134d

on:
  push:
    branches:
      - bootstrap/work18-status-bridge-20260819

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  index:
    if: github.event.head_commit.message == '[bootstrap] index recent protected CI runs'
    runs-on: ubuntu-latest
    steps:
      - name: Index recent CI runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const repo = process.env.GITHUB_REPOSITORY;
          const sha = process.env.GITHUB_SHA;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            'X-GitHub-Api-Version': '2022-11-28',
            'Content-Type': 'application/json',
          };
          const r = await fetch(`https://api.github.com/repos/${repo}/actions/workflows/ci.yml/runs?per_page=30`, { headers });
          const body = await r.json();
          if (!r.ok) throw new Error(`list CI runs failed ${r.status}`);
          for (const run of (body.workflow_runs ?? []).slice(0, 15)) {
            const m = String(run.display_title ?? '').match(/^CI PR #(\d+) @ ([0-9a-f]{40})$/);
            if (!m) continue;
            const state = run.status === 'completed' && run.conclusion === 'success' ? 'success' : run.status === 'completed' ? 'failure' : 'pending';
            const s = await fetch(`https://api.github.com/repos/${repo}/statuses/${sha}`, {
              method: 'POST', headers,
              body: JSON.stringify({
                state,
                context: `fugue/bootstrap-ci-pr${m[1]}/${run.id}`,
                description: `${run.status}/${run.conclusion ?? 'none'} ${m[2].slice(0,12)}`,
                target_url: run.html_url,
              }),
            });
            if (!s.ok) throw new Error(`status publish failed ${s.status}`);
          }
          NODE
