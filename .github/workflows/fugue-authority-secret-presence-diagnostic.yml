name: Fugue Authority Secret Presence Diagnostic

on:
  push:
    branches:
      - bootstrap/work18-status-bridge-20260819

permissions:
  contents: read
  statuses: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: fugue-authority
    env:
      HAS_AUTHORITY_KEY: ${{ secrets.FUGUE_AUTHORITY_APP_PRIVATE_KEY != '' }}
      HAS_AUTHORITY_CLIENT_ID: ${{ vars.FUGUE_AUTHORITY_APP_CLIENT_ID != '' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Publish presence-only diagnostic
        run: |
          node --input-type=module <<'NODE'
          const repo = process.env.GITHUB_REPOSITORY;
          const sha = process.env.GITHUB_SHA;
          const key = process.env.HAS_AUTHORITY_KEY === 'true';
          const client = process.env.HAS_AUTHORITY_CLIENT_ID === 'true';
          const category = `key-${key ? 'present' : 'absent'}-client-${client ? 'present' : 'absent'}`;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            'X-GitHub-Api-Version': '2026-03-10',
            'Content-Type': 'application/json',
          };
          const r = await fetch(`https://api.github.com/repos/${repo}/statuses/${sha}`, {
            method: 'POST', headers,
            body: JSON.stringify({
              state: key ? 'failure' : 'success',
              context: `fugue/bootstrap-authority-credentials/${category}`,
              description: key ? 'Authority key is exposed to broad environment branch access' : 'No Authority private key present in broad environment',
            }),
          });
          if (!r.ok) throw new Error(`status publish failed: ${r.status}`);
          NODE
