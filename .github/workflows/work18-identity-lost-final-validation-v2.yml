name: Work 18 Identity Lost Exact Head Validation v2

on:
  push:
    branches: [bootstrap/work18-identity-lost-20260818]

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[identity-lost-final-v2]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/18-migrate-fugue-to-chat-first-github-hosted-orchestration
          fetch-depth: 1
      - name: Update protected Integration invariant if needed
        run: |
          set -euo pipefail
          if ! grep -q 'FUGUE_INT_C_\*' AGENTS.md; then
            python <<'PY'
          from pathlib import Path
          path = Path('AGENTS.md')
          text = path.read_text()
          old = next(line for line in text.splitlines() if line.startswith('30. Protected Integration never treats Deployment'))
          new = "30. Protected Integration never treats Deployment, Deployment Status, mutable workflow-run/history pagination, actor/login presentation, environment/ref/SHA matching, or the public request/token/title as run-selection authority. Before POST, protected Authority creates a request-specific create-only `FUGUE_INT_F_*` may-have-dispatched fence. The API `2026-03-10` synchronous dispatch uses `return_run_details: true`; a valid exact returned run ID/URL is bound to d3 immediately. Independently, protected `workflow_run` lifecycle delivery authenticated to the Authority App numeric Bot identity may create one request-specific create-only `FUGUE_INT_B_*` exact-run witness, and the Integration workflow can later create its OIDC-signed run-start. Exact-L B/S writers, synchronous/d3 exact binding, and `identity_lost` terminalization all serialize through one request-local create-only `FUGUE_INT_C_*` commit slot: exact L winning C first makes stale `identity_lost` inert, while `identity_lost` winning C first permanently blocks delayed B/S/d3 rebinding. Exact writers revalidate their protected F/A or durable request authority after C before publication, and terminal cleanup deletes F/A/B/S before C so an already-running stale writer cannot recreate authority after cleanup. Any surviving exact witness binds only its real request/run/attempt and later replay cannot replace it; a known attempt-1 terminal completion—including hostile cancellation—is terminal and never retryable, while `aborted` is reserved for protected evidence affirmatively proving that no attempt was created. A known bound run that disappears remains exact terminal failure after grace. If F exists but the synchronous response and every attacker-resistant exact-run witness are unavailable/destroyed through the bounded grace period, the revised protocol commits terminal `identity_lost`: exact request ID, attempt 1, exact evaluation identity, protected F-boundary digest/time, and outcome are durable, while numeric run ID is intentionally absent only for this outcome. `identity_lost` is irreversible, never PASS/merge-ready/retry/replacement/later-run election, and any fresh Integration requires explicit Human action/new request. Request-specific F/B/C/anchor/run-start state is reclaimed only after durable terminal authority commits; cleanup is bounded, idempotent, request-local, and resumed by later reconciliation without changing terminal authority."
          path.write_text(text.replace(old, new, 1))
          PY
            git config user.name Johnny
            git config user.email 92900710+JohnnyZLi@users.noreply.github.com
            git add AGENTS.md
            git diff --cached --check
            git commit -m 'Document Integration terminal serialization invariant'
            git push origin HEAD:agent/18-migrate-fugue-to-chat-first-github-hosted-orchestration
          fi
          grep -q 'FUGUE_INT_C_\*' AGENTS.md
          grep -q 'hostile cancellation' AGENTS.md
      - id: head
        name: Resolve final exact head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  test:
    needs: repair
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.repair.outputs.sha }}
          persist-credentials: false
      - name: Confirm detached exact head and no publication credential
        env:
          EXPECTED_SHA: ${{ needs.repair.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git symbolic-ref -q HEAD || true)"
          test -z "$(git config --local --get-regexp 'http.*extraheader' || true)"
          test -z "$GITHUB_TOKEN"
          test -z "$GH_TOKEN"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  record:
    needs: [repair, test]
    if: always() && contains(github.event.head_commit.message, '[identity-lost-final-v2]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/work18-identity-lost-20260818
      - name: Record result
        run: |
          set -euo pipefail
          printf 'run_id=%s\ntest_result=%s\nvalidated_sha=%s\nwork_spec_digest=%s\n' '${{ github.run_id }}' '${{ needs.test.result }}' '${{ needs.repair.outputs.sha }}' 'sha256:249cd537997213f217727edfc9c86d2b41d7447219c1ee886ee4c61a9e6ee985' > .github/work18-identity-lost-final-validation-v2-result.txt
          git config user.name Johnny
          git config user.email 92900710+JohnnyZLi@users.noreply.github.com
          git add .github/work18-identity-lost-final-validation-v2-result.txt
          git commit -m 'Record final identity-lost exact-head validation' || exit 0
          git push origin HEAD:bootstrap/work18-identity-lost-20260818