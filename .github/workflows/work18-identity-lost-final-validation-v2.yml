name: Work 18 Ownership Fold Exact Head Validation

on:
  push:
    branches: [bootstrap/work18-identity-lost-20260818]

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[ownership-fold-v1]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/18-migrate-fugue-to-chat-first-github-hosted-orchestration
          fetch-depth: 1
      - name: Fold unassigned Integration implementation and tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "d90d511d671930837d4bf5a2c8741822cb82670a"
          python <<'PY'
          from pathlib import Path
          import re

          status_path = Path('src/core/integration-status.ts')
          commit_path = Path('src/core/integration-commit.ts')
          target_test_path = Path('tests/integration-plan.test.ts')
          source_test_path = Path('tests/integration-terminal-serialization.test.ts')
          blockers_path = Path('tests/state-authority-blockers.test.ts')

          if not commit_path.exists() or not source_test_path.exists():
              raise SystemExit('expected unassigned ownership paths are missing')

          status = status_path.read_text()
          commit_text = commit_path.read_text()
          body_marker = 'const INTEGRATION_COMMIT_PREFIX = "FUGUE_INT_C_";'
          if body_marker not in commit_text:
              raise SystemExit('integration commit body marker missing')
          commit_body = commit_text[commit_text.index(body_marker):].rstrip() + '\n\n'

          status, count = re.subn(
              r'import \{\n.*?\} from "\./integration-commit\.js";\n',
              '',
              status,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('integration-status import fold point missing')
          insertion = 'export type IntegrationState ='
          if insertion not in status:
              raise SystemExit('integration-status insertion point missing')
          status = status.replace(insertion, commit_body + insertion, 1)
          if 'integration-commit.js' in status:
              raise SystemExit('integration-status still references deleted module')
          status_path.write_text(status)

          focused = source_test_path.read_text()
          focused = focused.replace('import { describe, expect, it } from "vitest";\n', '', 1)
          focused = focused.replace('../src/core/integration-commit.js', '../src/core/integration-status.js')
          target = target_test_path.read_text()
          suite_marker = 'describe("request-local Integration terminal serialization"'
          if suite_marker in target:
              raise SystemExit('focused terminal serialization suite already folded')
          target_test_path.write_text(
              target.rstrip() + '\n\n// Focused request-local Integration terminal serialization regressions.\n' + focused
          )

          blockers = blockers_path.read_text()
          old = 'import { claimIdentityLostIntegrationCommit } from "../src/core/integration-commit.js";'
          new = 'import { claimIdentityLostIntegrationCommit } from "../src/core/integration-status.js";'
          if old not in blockers:
              raise SystemExit('state-authority integration-commit import missing')
          blockers_path.write_text(blockers.replace(old, new, 1))

          commit_path.unlink()
          source_test_path.unlink()
          PY
          test ! -e src/core/integration-commit.ts
          test ! -e tests/integration-terminal-serialization.test.ts
          ! grep -R --line-number --fixed-strings 'integration-commit.js' src tests
          ! git diff --name-only | grep -Fx package-lock.json
          git diff --check
          git config user.name Johnny
          git config user.email 92900710+JohnnyZLi@users.noreply.github.com
          git add src/core/integration-status.ts tests/integration-plan.test.ts tests/state-authority-blockers.test.ts
          git rm src/core/integration-commit.ts tests/integration-terminal-serialization.test.ts
          git diff --cached --check
          git commit -m 'Fold Integration terminal serialization into assigned paths'
          git push origin HEAD:agent/18-migrate-fugue-to-chat-first-github-hosted-orchestration
      - id: head
        name: Resolve final exact head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  test:
    needs: repair
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.repair.outputs.sha }}
          persist-credentials: false
      - name: Confirm detached exact head and no publication credential
        env:
          EXPECTED_SHA: ${{ needs.repair.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git symbolic-ref -q HEAD || true)"
          test -z "$(git config --local --get-regexp 'http.*extraheader' || true)"
          test -z "$GITHUB_TOKEN"
          test -z "$GH_TOKEN"
          test ! -e src/core/integration-commit.ts
          test ! -e tests/integration-terminal-serialization.test.ts
          ! git diff-tree --no-commit-id --name-only -r "$EXPECTED_SHA" | grep -Fx package-lock.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  record:
    needs: [repair, test]
    if: always() && contains(github.event.head_commit.message, '[ownership-fold-v1]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/work18-identity-lost-20260818
      - name: Record result
        run: |
          set -euo pipefail
          printf 'run_id=%s\ntest_result=%s\nvalidated_sha=%s\nwork_spec_digest=%s\n' '${{ github.run_id }}' '${{ needs.test.result }}' '${{ needs.repair.outputs.sha }}' 'sha256:249cd537997213f217727edfc9c86d2b41d7447219c1ee886ee4c61a9e6ee985' > .github/work18-ownership-fold-result.txt
          git config user.name Johnny
          git config user.email 92900710+JohnnyZLi@users.noreply.github.com
          git add .github/work18-ownership-fold-result.txt
          git commit -m 'Record work18 ownership fold validation' || exit 0
          git push origin HEAD:bootstrap/work18-identity-lost-20260818
