name: Work 18 Ownership Fold Exact Head Validation

on:
  push:
    branches: [bootstrap/work18-identity-lost-20260818]

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[ownership-fold-v2]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/18-migrate-fugue-to-chat-first-github-hosted-orchestration
          fetch-depth: 1
      - name: Restore folded Integration plan import
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "10043105b164237baac9c81c18ca6476b9f60e6c"
          python <<'PY'
          from pathlib import Path
          path = Path('src/core/integration-status.ts')
          text = path.read_text()
          if 'from "./integration-plan.js";' not in text:
              anchor = 'import type { FugueGitHub } from "./github.js";\n'
              block = '''import type { FugueGitHub } from "./github.js";\nimport {\n  createIntegrationRecord,\n  createIntegrationRequest,\n  integrationDispatchAuthorizationSchema,\n  integrationRunTitle,\n  integrationRequestSchema,\n  parseIntegrationRecord,\n  serializeIntegrationRecord,\n  type IntegrationDispatchAuthorization,\n  type IntegrationRecord,\n  type IntegrationRequest,\n  type IntegrationRunBinding,\n} from "./integration-plan.js";\n'''
              if anchor not in text:
                  raise SystemExit('github import anchor missing')
              path.write_text(text.replace(anchor, block, 1))
          PY
          grep -q 'from "./integration-plan.js";' src/core/integration-status.ts
          test ! -e src/core/integration-commit.ts
          test ! -e tests/integration-terminal-serialization.test.ts
          ! grep -R --line-number --fixed-strings 'integration-commit.js' src tests
          ! git diff --name-only | grep -Fx package-lock.json
          git diff --check
          git config user.name Johnny
          git config user.email 92900710+JohnnyZLi@users.noreply.github.com
          git add src/core/integration-status.ts
          git diff --cached --check
          git commit -m 'Restore Integration plan import after ownership fold'
          git push origin HEAD:agent/18-migrate-fugue-to-chat-first-github-hosted-orchestration
      - id: head
        name: Resolve final exact head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  test:
    needs: repair
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.repair.outputs.sha }}
          persist-credentials: false
      - name: Confirm detached exact head and no publication credential
        env:
          EXPECTED_SHA: ${{ needs.repair.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git symbolic-ref -q HEAD || true)"
          test -z "$(git config --local --get-regexp 'http.*extraheader' || true)"
          test -z "$GITHUB_TOKEN"
          test -z "$GH_TOKEN"
          test ! -e src/core/integration-commit.ts
          test ! -e tests/integration-terminal-serialization.test.ts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  record:
    needs: [repair, test]
    if: always() && contains(github.event.head_commit.message, '[ownership-fold-v2]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/work18-identity-lost-20260818
      - name: Record result
        run: |
          set -euo pipefail
          printf 'run_id=%s\ntest_result=%s\nvalidated_sha=%s\nwork_spec_digest=%s\n' '${{ github.run_id }}' '${{ needs.test.result }}' '${{ needs.repair.outputs.sha }}' 'sha256:249cd537997213f217727edfc9c86d2b41d7447219c1ee886ee4c61a9e6ee985' > .github/work18-ownership-fold-result.txt
          git config user.name Johnny
          git config user.email 92900710+JohnnyZLi@users.noreply.github.com
          git add .github/work18-ownership-fold-result.txt
          git commit -m 'Record work18 ownership fold validation' || exit 0
          git push origin HEAD:bootstrap/work18-identity-lost-20260818
