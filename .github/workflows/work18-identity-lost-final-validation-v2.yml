name: Work 18 Identity Lost Exact Head Validation v2

on:
  push:
    branches: [bootstrap/work18-identity-lost-20260818]

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[identity-lost-final-v2]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/18-migrate-fugue-to-chat-first-github-hosted-orchestration
          fetch-depth: 1
      - name: Add focused delayed-d3 race regressions if needed
        run: |
          set -euo pipefail
          if ! grep -q 'delayed d3 exact binding cannot reopen identity_lost' tests/state-authority-blockers.test.ts; then
            python <<'PY'
          from pathlib import Path
          path = Path('tests/state-authority-blockers.test.ts')
          text = path.read_text()
          first = '''      expect(github.__authorityVariables.has(protectedFence.names.fence)).toBe(false);\n      expect(github.__authorityVariables.has(protectedFence.names.binding)).toBe(false);\n\n      github.__comments.splice(0);'''
          first_replacement = '''      expect(github.__authorityVariables.has(protectedFence.names.fence)).toBe(false);\n      expect(github.__authorityVariables.has(protectedFence.names.binding)).toBe(false);\n\n      // delayed d3 exact binding cannot reopen identity_lost after terminal cleanup.\n      await expect(bindDispatchedIntegrationRun(\n        github, snapshot, request.request_id, 99003,\n        "https://github.com/JohnnyZLi/Fugue/actions/runs/99003", "2026-08-17T10:20:01.000Z",\n      )).rejects.toThrow(/active authorized durable request/);\n      expect([...github.__authorityVariables.keys()].some((name) => name.startsWith("FUGUE_INT_C_"))).toBe(false);\n      expect((await getCurrentIntegrationRecord(github, identity))?.terminal?.state).toBe("identity_lost");\n\n      github.__comments.splice(0);'''
          if first not in text:
              raise SystemExit('identity_lost delayed-d3 insertion point missing')
          text = text.replace(first, first_replacement, 1)

          second = '''      const bound = await getCurrentIntegrationRecord(github, identity);\n      expect(bound?.run).toMatchObject({ id: 99101, attempt: 1, html_url: htmlUrl });\n      expect(bound?.terminal).toBeNull();\n      expect(github.__authorityVariables.has(protectedFence.names.fence)).toBe(false);'''
          second_replacement = '''      const bound = await getCurrentIntegrationRecord(github, identity);\n      expect(bound?.run).toMatchObject({ id: 99101, attempt: 1, html_url: htmlUrl });\n      expect(bound?.terminal).toBeNull();\n\n      // W bound exact L into d3 first; a stale T proposal with run:null can never clear it.\n      const staleTerminalAt = new Date(Date.parse(bound!.created_at) + 1).toISOString();\n      await expect(publishIntegrationRecord(github, {\n        ...(bound!),\n        run: null,\n        terminal: {\n          state: "identity_lost", attempt: 1,\n          boundary_created_at: protectedFence.fence.created_at as string,\n          fence_digest: `sha256:${createHash("sha256").update(protectedFence.raw, "utf8").digest("hex")}`,\n          detail: "stale terminalizer must not clear exact L", created_at: staleTerminalAt,\n        },\n        created_at: staleTerminalAt,\n      } as IntegrationRecord)).rejects.toThrow(/cannot clear protected run/);\n      expect((await getCurrentIntegrationRecord(github, identity))?.run?.id).toBe(99101);\n      expect([...github.__authorityVariables.keys()].some((name) => name.startsWith("FUGUE_INT_C_"))).toBe(false);\n      expect(github.__authorityVariables.has(protectedFence.names.fence)).toBe(false);'''
          if second not in text:
              raise SystemExit('known-L stale-terminal insertion point missing')
          path.write_text(text.replace(second, second_replacement, 1))
          PY
            git config user.name Johnny
            git config user.email 92900710+JohnnyZLi@users.noreply.github.com
            git add tests/state-authority-blockers.test.ts
            git diff --cached --check
            git commit -m 'Regress delayed d3 terminal serialization races'
            git push origin HEAD:agent/18-migrate-fugue-to-chat-first-github-hosted-orchestration
          fi
          grep -q 'delayed d3 exact binding cannot reopen identity_lost' tests/state-authority-blockers.test.ts
          grep -q 'stale T proposal with run:null can never clear it' tests/state-authority-blockers.test.ts
      - id: head
        name: Resolve final exact head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  test:
    needs: repair
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.repair.outputs.sha }}
          persist-credentials: false
      - name: Confirm detached exact head and no publication credential
        env:
          EXPECTED_SHA: ${{ needs.repair.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git symbolic-ref -q HEAD || true)"
          test -z "$(git config --local --get-regexp 'http.*extraheader' || true)"
          test -z "$GITHUB_TOKEN"
          test -z "$GH_TOKEN"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  record:
    needs: [repair, test]
    if: always() && contains(github.event.head_commit.message, '[identity-lost-final-v2]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/work18-identity-lost-20260818
      - name: Record result
        run: |
          set -euo pipefail
          printf 'run_id=%s\ntest_result=%s\nvalidated_sha=%s\nwork_spec_digest=%s\n' '${{ github.run_id }}' '${{ needs.test.result }}' '${{ needs.repair.outputs.sha }}' 'sha256:249cd537997213f217727edfc9c86d2b41d7447219c1ee886ee4c61a9e6ee985' > .github/work18-identity-lost-final-validation-v2-result.txt
          git config user.name Johnny
          git config user.email 92900710+JohnnyZLi@users.noreply.github.com
          git add .github/work18-identity-lost-final-validation-v2-result.txt
          git commit -m 'Record final identity-lost exact-head validation' || exit 0
          git push origin HEAD:bootstrap/work18-identity-lost-20260818