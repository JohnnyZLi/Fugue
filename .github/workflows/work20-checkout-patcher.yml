name: Work 20 Checkout Patcher

on:
  push:
    branches:
      - bootstrap/work18-status-bridge-20260819

permissions:
  contents: write
  statuses: write

jobs:
  patch:
    if: github.event.head_commit.message == '[bootstrap] checkout-patch work-20 branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/20-fix-fugue-authority-token-bootstrap
      - name: Patch Authority App token inputs
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in [
              '.github/workflows/fugue-control-plane.yml',
              '.github/workflows/fugue-integration.yml',
          ]:
              path = Path(name)
              text = path.read_text()
              text = text.replace('          permission-actions: write\n', '')
              text = text.replace('          permission-variables: write\n', '')
              path.write_text(text)
          PY
      - name: Add focused regression
        run: |
          if ! grep -q 'Fugue Authority App token workflow configuration' tests/ci.test.ts; then
            cat >> tests/ci.test.ts <<'EOF'

          describe("Fugue Authority App token workflow configuration", () => {
            it("inherits the deliberately narrow App installation permissions instead of using unsupported permission selectors", async () => {
              for (const path of [
                ".github/workflows/fugue-control-plane.yml",
                ".github/workflows/fugue-integration.yml",
              ]) {
                const workflow = await readFile(path, "utf8");
                expect(workflow).toContain("actions/create-github-app-token@v3");
                expect(workflow).toContain("FUGUE_AUTHORITY_APP_CLIENT_ID");
                expect(workflow).toContain("FUGUE_AUTHORITY_APP_PRIVATE_KEY");
                expect(workflow).not.toContain("permission-variables:");
                expect(workflow).not.toContain("permission-actions:");
              }
            });
          });
          EOF
          fi
      - name: Commit scoped hotfix
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/fugue-control-plane.yml .github/workflows/fugue-integration.yml tests/ci.test.ts
          git diff --cached --check
          git commit -m '[work-20] Fix Fugue Authority token permission minting'
          git push origin HEAD:agent/20-fix-fugue-authority-token-bootstrap
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish patch result
        if: success()
        env:
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const repo = process.env.GITHUB_REPOSITORY;
          const sha = process.env.GITHUB_SHA;
          const target = process.env.TARGET_SHA;
          const r = await fetch(`https://api.github.com/repos/${repo}/statuses/${sha}`, {
            method: 'POST',
            headers: {
              Accept: 'application/vnd.github+json',
              Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              state: 'success',
              context: `fugue/bootstrap-work20-checkout/${target.slice(0,12)}`,
              description: `work-20 branch patched at ${target.slice(0,12)}`,
              target_url: `https://github.com/${repo}/commit/${target}`,
            }),
          });
          if (!r.ok) throw new Error(`status publish failed ${r.status}`);
          NODE
