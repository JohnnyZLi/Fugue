name: Work 18 Current Exact Head Validation

on:
  push:
    branches: [bootstrap/work18-worker-repair-20260818-2]

permissions:
  contents: read

jobs:
  test:
    if: contains(github.event.head_commit.message, '[work18-current-final-validate]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
        with:
          repository: JohnnyZLi/Fugue
          ref: 57b1d187ec4e6230fc68db47071ee2dea80c114f
          persist-credentials: false
      - name: Confirm detached exact head
        run: test "$(git rev-parse HEAD)" = "57b1d187ec4e6230fc68db47071ee2dea80c114f"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  record:
    needs: test
    if: always() && contains(github.event.head_commit.message, '[work18-current-final-validate]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/work18-worker-repair-20260818-2
      - name: Record exact validation result
        run: |
          echo "run_id=${{ github.run_id }}" > .github/work18-current-final-validation-result.txt
          echo "test_result=${{ needs.test.result }}" >> .github/work18-current-final-validation-result.txt
          echo "validated_sha=57b1d187ec4e6230fc68db47071ee2dea80c114f" >> .github/work18-current-final-validation-result.txt
          echo "work_spec_digest=sha256:d68ce1214ed0aee5e8d1cad0539d535ef2c9d7ce90ea1a74be06359e0c6953e1" >> .github/work18-current-final-validation-result.txt
          git config user.name Johnny
          git config user.email 92900710+JohnnyZLi@users.noreply.github.com
          git add .github/work18-current-final-validation-result.txt
          git commit -m 'Record current work-18 exact-head validation'
          git push origin HEAD:bootstrap/work18-worker-repair-20260818-2
